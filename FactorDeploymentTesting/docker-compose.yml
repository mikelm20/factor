version: "3.9"

# Define the networks
networks:
  backend:
  db:

# Define the services/containers to be run
services:
  back: #name of the second service
    env_file: .back.env
    image: mikelm20/factor-back-end
    container_name: factor-back-end
    volumes:
      - "../factor-back-end/factor-back-end/assets:/factor/assets"
    ports:
      - "5000:5000" #specify port forwarding
    networks:
      - backend
    depends_on:
      - database
    entrypoint:
      - /bin/sh
      - ./wait-for.sh
      - database:27017
      - --
      - node
      - app.js
    restart: always

  database: # name of the third service
    env_file: .db.env
    image: mongo # specify image to build container from
    container_name: database
    volumes:
      - "./database/:/data/db"
      - "./factor-db-init/:/docker-entrypoint-initdb.d/"
    networks:
      - backend
      - db
    restart: always

