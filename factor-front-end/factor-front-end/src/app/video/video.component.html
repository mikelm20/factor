<h2>My Videos</h2>
<ul class="videos">
    <nav>
        <div *ngFor="let item of li; let x = index">
            <button (click)="onPress(x)">{{item.name}}</button>
            <button (click)="transcribeAWS(x)">AWS</button>
            <button (click)="transcribeDS(x)">DS</button>
        </div>
        <div *ngIf="display">
            <app-play [list]="li" [i]="i"></app-play>
        </div>
    </nav>
</ul>
